server:
  port: ${BACKEND_PORT:8080}
spring:
  application:
    name: jobpilot-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jobpilot}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health,info

jobpilot:
  worker-url: ${WORKER_URL:http://localhost:8000}
  storage-dir: ${JOBPILOT_STORAGE_DIR:../storage/resumes}
  tailored-dir: ${JOBPILOT_TAILORED_DIR:../storage/tailored}
